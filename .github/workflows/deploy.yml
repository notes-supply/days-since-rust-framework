name: Deploy
on:
  schedule:
    - cron: '5 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare runner
        id: host
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          if [ ! -s /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y fonts-dejavu-core
          fi
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: binary
        with:
          path: target/release/days-since-rust-framework
          key: binary-v1-${{ steps.host.outputs.image }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'mise.toml', 'mise.lock', 'src/**', 'build.rs', '.cargo/**', '.github/workflows/deploy.yml') }}
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          version: 2026.10.17
          install_args: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.host.outputs.image }}
          cache-bin: false
          cache-on-failure: true
      - name: Compile
        if: steps.binary.outputs.cache-hit != 'true'
        run: mise exec rust -- cargo build --release --locked
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          path: target/release/days-since-rust-framework
          key: ${{ steps.binary.outputs.cache-primary-key }}
      - name: Build production site
        run: target/release/days-since-rust-framework build --production
      - name: Set up patched Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked deployment dependencies
        run: npm ci --ignore-scripts
      - name: Deploy
        run: npm exec --no -- wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
