[package]
name = "days-since-rust-framework"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
brotli = "9.0.0"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
jiff = { version = "0.2.38", features = ["serde"] }
proa_core = "0.3.0"
proa_macros = "0.3.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.4.2"

[profile.release]
opt-level = 1
strip = true
